<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Test</title>
    <link rel="stylesheet" href="radio-buttons.css">
    <link rel="stylesheet" href="../../distribution/tokens.css">
</head>
<body>
<label class="radio-option">
  <input type="radio" name="test" autofocus>
  <span class="radio-control"></span>
  <span class="radio-label">Option One</span>
</label>

<label class="radio-option">
  <input type="radio" name="test" disabled>
  <span class="radio-control"></span>
  <span class="radio-label">Option Two</span>
</label>

</body>
</html>
