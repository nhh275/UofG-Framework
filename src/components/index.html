<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Test</title>
    <link rel="stylesheet" href="../../distribution/tokens.css">
    <link rel="stylesheet" href="buttons.css">

</head>
<body>
    <button class="btn-primary primary">Primary Button</button>
    <button class="btn-secondary primary" autofocus>Secondary Button</button>
    <button class="btn-outline primary">Outline Button</button>

    <button class="btn-primary primary" disabled>Primary Button Disabled</button>

    <button class="btn-outline primary" disabled>Outline Button Disabled</button>

</body>
