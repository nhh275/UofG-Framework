{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Testing</title>

    <link rel="stylesheet" href="{% static 'styleUtilities.css' %}">
    <link rel="stylesheet" href="{% static 'main.css' %}">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h2 {
            margin-top: 30px;
            color: #003d7a;
        }
        .section {
            background-color: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 10px 0;
        }
    </style>
</head>
<body>

<h1>Buttons</h1>

<div class="section">
    <h2>Buttons – Primary</h2>
    <div class="button-group">
        <button class="btn btn-primary">Primary</button>
        <button class="btn btn-primary" disabled>Primary Disabled</button>
    </div>
</div>

<div class="section">
    <h2>Buttons – Secondary</h2>
    <div class="button-group">
        <button class="btn btn-secondary">Secondary</button>
        <button class="btn btn-secondary" disabled>Secondary Disabled</button>
    </div>
</div>

<div class="section">
    <h2>Buttons – Outline</h2>
    <div class="button-group">
        <button class="btn btn-outline">Outline</button>
        <button class="btn btn-outline" disabled>Outline Disabled</button>
    </div>
</div>

<hr>
<a href="/">Back to Home</a>

</body>
</html>
