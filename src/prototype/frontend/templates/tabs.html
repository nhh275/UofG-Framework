{% load static %}
<!doctype html>

<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title> Tabs + Spacing Utilities </title>

    <!-- Utility styles -->


    <!-- Tabs component styles -->
    <link rel="stylesheet" href="{% static 'styleUtilities.css' %}">
    <link rel="stylesheet" href="{% static 'main.css' %}">
    <script src="{% static 'components.js' %}" defer></script>


    <style>
        h2 { margin-top: 50px; }
        h3 { margin-top: 30px; }

        code {
            background: #eee;
            padding: 2px 6px;
            border-radius: 6px;
        }

        .frame {
            border: 3px dashed #999;
            border-radius: 12px;
            padding: 12px;
            background: #fafafa;
            margin-top: 12px;
        }

        .content {
            border: 3px solid #333;
            border-radius: 10px;
            background: white;
        }
    </style>
</head>

<body>

    <h1>Tabs Component Test</h1>

    <h2>Study Level Tabs</h2>

    <div class="frame">

        <div class="uofg-tabs" data-tabs>
            <div class="uofg-tabs__list"
                 role="tablist"
                 aria-label="Study level">

                <button class="uofg-tabs__tab uofg-tabs__tab--active"
                        type="button"
                        role="tab"
                        id="tab-undergrad"
                        aria-selected="true"
                        aria-controls="panel-undergrad"
                        tabindex="0">
                    Undergraduate
                </button>

                <button class="uofg-tabs__tab"
                        type="button"
                        role="tab"
                        id="tab-postgrad"
                        aria-selected="false"
                        aria-controls="panel-postgrad"
                        tabindex="-1">
                    Postgraduate
                </button>
            </div>

            <div class="uofg-tabs__panel uofg-tabs__panel--active content u-p-4"
                 role="tabpanel"
                 id="panel-undergrad"
                 aria-labelledby="tab-undergrad">
                <p>
                    Undergraduate content goes here.
                </p>
            </div>

            <div class="uofg-tabs__panel content u-p-4"
                 role="tabpanel"
                 id="panel-postgrad"
                 aria-labelledby="tab-postgrad"
                 hidden>
                <p>
                    Postgraduate content goes here.
                </p>
            </div>
        </div>

    </div>
</body>
    <hr>
    <a href="/">Back to Home</a>
</html>
