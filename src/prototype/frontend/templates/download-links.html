{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Download link test</title>

    <link rel="stylesheet" href="{% static 'styleUtilities.css' %}">
    <link rel="stylesheet" href="{% static 'main.css' %}">

    <link rel="stylesheet" href="{% static 'main.css' %}">


  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
    }

    .download-list {
      display: grid;
      gap: 1.25rem;
      max-width: 1100px;
    }
  </style>
</head>

<body>

  <h1>Download link test</h1>
  <p>Hover with mouse and press TAB to test focus.</p>

  <div class="download-list">
    <a class="zh-download-link" href="#" download>
      <span class="zh-download-link__bar"></span>

      <span class="zh-download-link__content">
        <span class="zh-download-link__title">Document title</span>
        <span class="zh-download-link__meta">
          <span>PDF</span>
          <span class="zh-download-link__sep">|</span>
          <span>545K</span>
        </span>
      </span>

      <span class="zh-download-link__right">
        <span class="zh-download-link__icon">⬇</span>
      </span>
    </a>

    <a class="zh-download-link" href="#" download>
      <span class="zh-download-link__bar"></span>

      <span class="zh-download-link__content">
        <span class="zh-download-link__title">
          Really long document title wow long coursework type shit
        </span>
        <span class="zh-download-link__meta">
          <span>DOCX</span>
          <span class="zh-download-link__sep">|</span>
          <span>1.2MB</span>
        </span>
      </span>

      <span class="zh-download-link__right">
        <span class="zh-download-link__icon">⬇</span>
      </span>
    </a>
  </div>

</body>
</html>
